<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LINE 客戶追蹤{% endblock %}｜美之耀</title>
<style>
:root{
  --bg:#FAF7F1; --card:#FFFFFF; --ink:#2B2620; --muted:#8A8175; --line:#E8DFCF;
  --gold:#B08A3E; --gold-soft:#F4EBD8;
  --urgent:#B3261E; --urgent-soft:#FBE9E7;
  --reply:#9A5B13; --reply-soft:#FDF1E1;
  --follow:#3D6B8C; --follow-soft:#E6EFF5;
  --done:#6B7A6B; --done-soft:#EEF1EC;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15130F; --card:#1E1B16; --ink:#EDE6DA; --muted:#A39A8C; --line:#3A342A;
    --gold:#D9B368; --gold-soft:#2E2718;
    --urgent:#F08A80; --urgent-soft:#3A1C19;
    --reply:#E6B070; --reply-soft:#33261A;
    --follow:#8DB6D3; --follow-soft:#1A2833;
    --done:#A8B7A8; --done-soft:#222822;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
a{color:var(--gold)}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}
header h1{margin:0;font-size:20px;letter-spacing:.08em}
header h1 small{display:block;font-size:12px;color:var(--muted);letter-spacing:.2em;font-weight:400}
input,textarea,button{font:inherit;color:inherit}
input[type=search],input[type=date],textarea{background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:80px}
button,.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;
  cursor:pointer;text-decoration:none;color:var(--ink);font-size:14px;white-space:nowrap}
button.primary{background:var(--gold);border-color:var(--gold);color:#fff}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;margin:0 4px 4px 0;
  background:var(--gold-soft);color:var(--gold)}
.s-urgent{--c:var(--urgent);--cs:var(--urgent-soft)}
.s-reply{--c:var(--reply);--cs:var(--reply-soft)}
.s-due,.s-follow{--c:var(--follow);--cs:var(--follow-soft)}
.s-done{--c:var(--done);--cs:var(--done-soft)}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--cs);color:var(--c);font-weight:700}
.muted{color:var(--muted);font-size:13px}
.systems{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center;margin:-8px 0 12px;font-size:13px}
.systems a,.systems span{padding:3px 10px;border-radius:8px;text-decoration:none;white-space:nowrap}
.systems a{color:var(--muted);border:1px dashed var(--line)}
.systems a:hover{color:var(--gold);border-color:var(--gold)}
.systems span{color:var(--gold);font-weight:700}
</style>
</head>
<body><div class="wrap">
{% if g.user %}
<nav class="systems" aria-label="切換系統">
  <span>LINE 客服</span>
  <a href="{{ TREAT_URL }}">治療單 ↗</a>
  <a href="{{ PERF_URL }}">行政績效 ↗</a>
</nav>
{% endif %}
{% block body %}{% endblock %}</div></body>
</html>
