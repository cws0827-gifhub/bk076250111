{% extends "base.html" %}
{% block title %}登入{% endblock %}
{% block body %}
<div style="min-height:80vh;display:grid;place-items:center">
  <form method="post" class="card" style="width:100%;max-width:360px;padding:32px 24px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:12px;letter-spacing:.35em;color:var(--gold)">MEI ZHI YAO</div>
      <h1 style="margin:6px 0 0;font-size:20px;letter-spacing:.12em">LINE 客戶追蹤</h1>
      <div class="muted" style="margin-top:4px">顧問式服務看板</div>
    </div>
    {% if error %}
    <div style="background:var(--urgent-soft);color:var(--urgent);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:14px">{{ error }}</div>
    {% endif %}
    <input type="hidden" name="next" value="{{ next_url }}">
    <label class="muted" for="username">帳號</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="off" required
           style="width:100%;margin:4px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px">
    <label class="muted" for="password">密碼</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required
           style="width:100%;margin:4px 0 20px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px">
    <button class="primary" style="width:100%;padding:11px">登入</button>
  </form>
</div>
{% endblock %}
